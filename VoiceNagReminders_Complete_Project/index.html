<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Voice Nag Reminders</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --warning: #f59e0b;
      --success: #10b981;
      --success-hover: #059669;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 90px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-top: 8px;
    }

    .app-title {
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-live {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 9999px;
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.4; }
    }

    /* Voice Action Banner */
    .voice-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid #3b82f640;
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 0 20px rgba(59, 130, 246, 0.15);
      position: relative;
      overflow: hidden;
    }

    .mic-button-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 10px auto;
    }

    .mic-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: white;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      z-index: 2;
    }

    .mic-btn:active {
      transform: scale(0.92);
    }

    .mic-btn.listening {
      background: var(--danger);
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.6);
      animation: mic-listening 1.5s infinite;
    }

    @keyframes mic-listening {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .pulse-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--danger);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    .listening .pulse-ring {
      animation: ring-pulse 1.8s infinite;
    }

    @keyframes ring-pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .voice-hint {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 10px;
      line-height: 1.4;
    }

    .voice-transcript {
      margin-top: 12px;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px dashed var(--card-border);
      border-radius: 10px;
      font-size: 0.95rem;
      color: #93c5fd;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-style: italic;
    }

    /* Manual / Edit Form */
    .task-form {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 24px;
    }

    .form-header {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:active {
      background: var(--primary-hover);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: #1e293b80;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    /* Task List */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }

    .task-card.nagging {
      border: 2px solid var(--danger);
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.12), var(--card-bg));
      animation: alert-glow 1.5s infinite alternate;
    }

    @keyframes alert-glow {
      0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
      100% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.7); }
    }

    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .task-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
    }

    .task-status {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .status-scheduled {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .status-nagging {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border: 1px solid var(--danger);
      animation: pulse 1s infinite;
    }

    .status-completed {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .task-details {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .task-detail-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .task-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    /* Full-screen Urgent Nag Modal */
    .alarm-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .alarm-modal.active {
      display: flex;
      animation: modal-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modal-pop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .alarm-icon-bell {
      font-size: 64px;
      margin-bottom: 16px;
      animation: ring-bell 0.6s infinite alternate ease-in-out;
    }

    @keyframes ring-bell {
      0% { transform: rotate(-18deg); }
      100% { transform: rotate(18deg); }
    }

    .alarm-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
    }

    .alarm-nag-notice {
      color: var(--danger);
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 24px;
      background: rgba(239, 68, 68, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .alarm-btn-complete {
      width: 100%;
      max-width: 320px;
      padding: 16px;
      font-size: 1.1rem;
      background: var(--success);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .alarm-btn-complete:active {
      background: var(--success-hover);
      transform: scale(0.98);
    }

    .alarm-btn-snooze {
      width: 100%;
      max-width: 320px;
      padding: 12px;
      font-size: 0.95rem;
      background: #334155;
      color: #cbd5e1;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Sound tester / config bar */
    .quick-settings {
      margin-top: 24px;
      padding: 14px;
      background: #1e293b60;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title">
      <span>🔔</span> Voice Nag Reminders
    </div>
    <div class="badge-live">Engine Active</div>
  </header>

  <!-- Big Voice Input Hero -->
  <div class="voice-card">
    <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px;">Tap & Speak Your Task</div>
    <div class="voice-hint">Say: <i>"Call mom tomorrow at 6 PM"</i> or <i>"Take medicine in 30 minutes"</i></div>
    
    <div class="mic-button-wrap">
      <div class="pulse-ring"></div>
      <button id="micBtn" class="mic-btn" title="Tap to speak">
        🎙️
      </button>
    </div>

    <div id="transcriptBox" class="voice-transcript">
      Tap mic to start speaking...
    </div>
  </div>

  <!-- Quick Add / Edit Section -->
  <div class="task-form">
    <div class="form-header">
      <span id="formTitle">Schedule Reminder</span>
      <span style="font-size: 0.8rem; color: var(--text-muted);">Auto-filled by voice</span>
    </div>

    <div class="input-group">
      <label for="taskInput">Task Title</label>
      <input type="text" id="taskInput" placeholder="e.g. Call dentist to book appointment">
    </div>

    <div class="form-grid">
      <div class="input-group">
        <label for="dateInput">Reminder Date & Time</label>
        <input type="datetime-local" id="dateInput">
      </div>
      <div class="input-group">
        <label for="nagInterval">Nag Interval (Repeat)</label>
        <select id="nagInterval">
          <option value="1">Every 1 minute</option>
          <option value="2" selected>Every 2 minutes</option>
          <option value="5">Every 5 minutes</option>
          <option value="10">Every 10 minutes</option>
          <option value="15">Every 15 minutes</option>
          <option value="30">Every 30 minutes</option>
        </select>
      </div>
    </div>

    <button id="saveTaskBtn" class="btn btn-primary" style="margin-top: 6px;">
      💾 Save Reminder
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tabActive">Pending & Nagging (<span id="activeCount">0</span>)</button>
    <button class="tab-btn" id="tabCompleted">Completed (<span id="completedCount">0</span>)</button>
  </div>

  <!-- Task Container -->
  <div id="taskList" class="task-list">
    <!-- Populated by JS -->
  </div>

  <!-- Quick Settings & Audio Test -->
  <div class="quick-settings">
    <span>🔊 Audio & Vibration Alert</span>
    <button id="testSoundBtn" class="btn-link">Test Alarm Sound</button>
  </div>

  <!-- Urgent Nag / Alarm Modal Overlay -->
  <div id="alarmModal" class="alarm-modal">
    <div class="alarm-icon-bell">⏰</div>
    <div class="alarm-title" id="alarmModalTitle">Task Due!</div>
    <div class="alarm-nag-notice" id="alarmNagNotice">⚠️ Nagging: Repeating alarm until completed!</div>
    
    <button id="modalCompleteBtn" class="alarm-btn-complete">
      <span>✓</span> Confirm Completed (Stop Forever)
    </button>
    
    <button id="modalSnoozeBtn" class="alarm-btn-snooze">
      Snooze for 5 minutes
    </button>
  </div>

  <script>
    // --- State & LocalStorage ---
    let tasks = JSON.parse(localStorage.getItem('nag_reminders_tasks') || '[]');
    let currentTab = 'active';
    let activeAlarmTaskId = null;
    let alarmAudioInterval = null;

    // --- Audio Synthesis via Web Audio API (No external sound files required) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeepPattern() {
      try {
        initAudio();
        const now = audioCtx.currentTime;

        // Create 3 rapid pleasant alert beeps
        [0, 0.15, 0.3].forEach((delay, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(idx === 2 ? 880 : 587.33, now + delay); // D5 then A5

          gain.gain.setValueAtTime(0.3, now + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.12);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now + delay);
          osc.stop(now + delay + 0.13);
        });

        // Vibration for mobile devices
        if ('vibrate' in navigator) {
          navigator.vibrate([300, 150, 300, 150, 450]);
        }
      } catch (e) {
        console.warn('Audio playback error:', e);
      }
    }

    // --- Speech Recognition ---
    const micBtn = document.getElementById('micBtn');
    const transcriptBox = document.getElementById('transcriptBox');
    const taskInput = document.getElementById('taskInput');
    const dateInput = document.getElementById('dateInput');
    const nagInterval = document.getElementById('nagInterval');

    // Default datetime-local to 10 minutes from now
    function getDefaultDateTimeString(minsAhead = 10) {
      const d = new Date(Date.now() + minsAhead * 60000);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    dateInput.value = getDefaultDateTimeString(10);

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        transcriptBox.textContent = 'Listening... Speak your task and time';
        initAudio();
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        transcriptBox.textContent = `"${transcript}"`;
        if (event.results[0].isFinal) {
          parseVoiceCommand(transcript);
        }
      };

      recognition.onerror = (event) => {
        console.error('Speech error:', event.error);
        micBtn.classList.remove('listening');
        isListening = false;
        transcriptBox.textContent = `Error: ${event.error}. You can also type below!`;
      };

      recognition.onend = () => {
        micBtn.classList.remove('listening');
        isListening = false;
      };

      micBtn.addEventListener('click', () => {
        initAudio();
        if (isListening) {
          recognition.stop();
        } else {
          try {
            recognition.start();
          } catch(e) {
            console.warn(e);
          }
        }
      });
    } else {
      transcriptBox.textContent = 'Web Speech not supported in this browser. Please type below.';
      micBtn.style.opacity = '0.5';
    }

    // --- Natural Language Date & Task Parser ---
    function parseVoiceCommand(text) {
      let cleaned = text.trim();
      let targetDate = new Date();
      let detectedTime = false;

      // Check relative minutes/hours: "in 15 minutes", "in 1 hour"
      const inMinutesMatch = cleaned.match(/in\\s+(\\d+)\\s*(minute|min|m)s?/i);
      const inHoursMatch = cleaned.match(/in\\s+(\\d+)\\s*(hour|hr|h)s?/i);

      if (inMinutesMatch) {
        const mins = parseInt(inMinutesMatch[1], 10);
        targetDate = new Date(Date.now() + mins * 60000);
        detectedTime = true;
        cleaned = cleaned.replace(inMinutesMatch[0], '');
      } else if (inHoursMatch) {
        const hrs = parseInt(inHoursMatch[1], 10);
        targetDate = new Date(Date.now() + hrs * 3600000);
        detectedTime = true;
        cleaned = cleaned.replace(inHoursMatch[0], '');
      }

      // Check "tomorrow"
      if (/tomorrow/i.test(cleaned)) {
        targetDate.setDate(targetDate.getDate() + 1);
        detectedTime = true;
        cleaned = cleaned.replace(/tomorrow/i, '');
      }

      // Check explicit time like "at 5:30 pm", "at 4 pm", "at 10 am"
      const timeMatch = cleaned.match(/at\\s+(\\d{1,2})(?::(\\d{2}))?\\s*(am|pm)?/i);
      if (timeMatch) {
        let hours = parseInt(timeMatch[1], 10);
        let minutes = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0;
        const meridian = timeMatch[3] ? timeMatch[3].toLowerCase() : null;

        if (meridian === 'pm' && hours < 12) hours += 12;
        if (meridian === 'am' && hours === 12) hours = 0;

        targetDate.setHours(hours, minutes, 0, 0);
        detectedTime = true;
        cleaned = cleaned.replace(timeMatch[0], '');
      }

      // Clean up common filler words
      cleaned = cleaned.replace(/^(remind me to|remind me|schedule|add a task to|add task)\\s+/i, '');
      cleaned = cleaned.replace(/\\s+(today|tonight)$/i, '');
      cleaned = cleaned.trim();

      // If no future time was detected, default to 15 minutes from now
      if (!detectedTime || targetDate.getTime() <= Date.now()) {
        if (!detectedTime) {
          targetDate = new Date(Date.now() + 15 * 60000);
        } else {
          // If time is earlier today, assume tomorrow
          targetDate.setDate(targetDate.getDate() + 1);
        }
      }

      // Populate input fields
      taskInput.value = cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
      
      const pad = n => String(n).padStart(2, '0');
      dateInput.value = `${targetDate.getFullYear()}-${pad(targetDate.getMonth()+1)}-${pad(targetDate.getDate())}T${pad(targetDate.getHours())}:${pad(targetDate.getMinutes())}`;
      
      transcriptBox.innerHTML = `✓ Recognized: <b>${taskInput.value}</b><br><small>Scheduled for ${targetDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</small>`;
    }

    // --- Save & Manage Tasks ---
    document.getElementById('saveTaskBtn').addEventListener('click', () => {
      const title = taskInput.value.trim();
      const dueStr = dateInput.value;
      const intervalMins = parseInt(nagInterval.value, 10);

      if (!title) {
        alert('Please enter or speak a task title');
        return;
      }
      if (!dueStr) {
        alert('Please select a reminder date & time');
        return;
      }

      initAudio();

      const newTask = {
        id: 'task_' + Date.now(),
        title: title,
        dueDate: new Date(dueStr).getTime(),
        nagIntervalMinutes: intervalMins,
        completed: false,
        completedAt: null,
        lastNaggedAt: 0,
        createdAt: Date.now()
      };

      tasks.unshift(newTask);
      saveTasks();
      renderTasks();

      // Reset form
      taskInput.value = '';
      dateInput.value = getDefaultDateTimeString(10);
      transcriptBox.textContent = 'Task saved! It will remind you until marked done.';

      // Request notification permission if not yet decided
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    });

    function saveTasks() {
      localStorage.setItem('nag_reminders_tasks', JSON.stringify(tasks));
      updateCounts();
    }

    function updateCounts() {
      const active = tasks.filter(t => !t.completed).length;
      const completed = tasks.filter(t => t.completed).length;
      document.getElementById('activeCount').textContent = active;
      document.getElementById('completedCount').textContent = completed;
    }

    // --- Complete Task (Stops Nagging Permanently) ---
    function completeTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = true;
        task.completedAt = Date.now();
        saveTasks();
        renderTasks();

        // Dismiss modal if this was the active alarm
        if (activeAlarmTaskId === id) {
          stopAlarmModal();
        }
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
      if (activeAlarmTaskId === id) {
        stopAlarmModal();
      }
    }

    function snoozeTask(id, mins = 5) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.dueDate = Date.now() + mins * 60000;
        task.lastNaggedAt = Date.now();
        saveTasks();
        renderTasks();
        stopAlarmModal();
      }
    }

    // --- Urgent Nagging Alarm Modal ---
    const alarmModal = document.getElementById('alarmModal');
    const alarmModalTitle = document.getElementById('alarmModalTitle');
    const alarmNagNotice = document.getElementById('alarmNagNotice');
    const modalCompleteBtn = document.getElementById('modalCompleteBtn');
    const modalSnoozeBtn = document.getElementById('modalSnoozeBtn');

    function triggerAlarmModal(task) {
      activeAlarmTaskId = task.id;
      alarmModalTitle.textContent = task.title;
      alarmNagNotice.textContent = `⚠️ Nagging every ${task.nagIntervalMinutes} min until marked complete!`;
      alarmModal.classList.add('active');

      // Play beeps pattern immediately
      playBeepPattern();

      // Clear any prior interval
      if (alarmAudioInterval) clearInterval(alarmAudioInterval);

      // Repeat sound chime every 10 seconds while modal is in front of user
      alarmAudioInterval = setInterval(() => {
        if (activeAlarmTaskId) {
          playBeepPattern();
        }
      }, 10000);

      // Send system notification if permitted
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(`Nagging: ${task.title}`, {
          body: `Tap to mark completed and stop repeating reminders.`,
          icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text y="20" font-size="20">🔔</text></svg>',
          tag: task.id
        });
      }
    }

    function stopAlarmModal() {
      activeAlarmTaskId = null;
      alarmModal.classList.remove('active');
      if (alarmAudioInterval) {
        clearInterval(alarmAudioInterval);
        alarmAudioInterval = null;
      }
    }

    modalCompleteBtn.addEventListener('click', () => {
      if (activeAlarmTaskId) {
        completeTask(activeAlarmTaskId);
      }
    });

    modalSnoozeBtn.addEventListener('click', () => {
      if (activeAlarmTaskId) {
        snoozeTask(activeAlarmTaskId, 5);
      }
    });

    // --- Background Nagging Loop (Checks every 3 seconds) ---
    setInterval(() => {
      const now = Date.now();
      let shouldNagTask = null;

      tasks.forEach(task => {
        if (!task.completed && task.dueDate <= now) {
          // Check if it's time to nag
          const intervalMs = task.nagIntervalMinutes * 60000;
          if (now - task.lastNaggedAt >= intervalMs) {
            task.lastNaggedAt = now;
            shouldNagTask = task;
          }
        }
      });

      if (shouldNagTask && !activeAlarmTaskId) {
        saveTasks();
        renderTasks();
        triggerAlarmModal(shouldNagTask);
      } else {
        // Just update UI timer badges
        renderTasks(false);
      }
    }, 3000);

    // --- Render Task Cards ---
    function renderTasks(fullRebuild = true) {
      const container = document.getElementById('taskList');
      const now = Date.now();

      const filtered = tasks.filter(t => currentTab === 'active' ? !t.completed : t.completed);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 40px; margin-bottom: 8px;">${currentTab === 'active' ? '📋' : '🎉'}</div>
            <div style="font-weight: 600;">No ${currentTab} reminders</div>
            <div style="font-size: 0.85rem; margin-top: 4px;">${currentTab === 'active' ? 'Speak into the mic above to create a nag reminder!' : 'Completed tasks will appear here.'}</div>
          </div>
        `;
        return;
      }

      if (!fullRebuild && container.children.length === filtered.length) {
        // Light update of timestamps without destroying DOM focus
        filtered.forEach((task, idx) => {
          const card = container.children[idx];
          if (card) {
            const isNagging = !task.completed && task.dueDate <= now;
            if (isNagging && !card.classList.contains('nagging')) {
              card.classList.add('nagging');
            } else if (!isNagging && card.classList.contains('nagging')) {
              card.classList.remove('nagging');
            }
          }
        });
        return;
      }

      container.innerHTML = '';
      filtered.forEach(task => {
        const isNagging = !task.completed && task.dueDate <= now;
        const dueFormatted = new Date(task.dueDate).toLocaleString([], {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const card = document.createElement('div');
        card.className = `task-card ${isNagging ? 'nagging' : ''}`;

        card.innerHTML = `
          <div class="task-top">
            <div class="task-title">${escapeHtml(task.title)}</div>
            <div class="task-status ${task.completed ? 'status-completed' : (isNagging ? 'status-nagging' : 'status-scheduled')}">
              ${task.completed ? 'Completed' : (isNagging ? '🔔 Nagging Active' : 'Scheduled')}
            </div>
          </div>

          <div class="task-details">
            <div class="task-detail-item">
              <span>📅</span> ${task.completed ? 'Finished: ' + new Date(task.completedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Due: ' + dueFormatted}
            </div>
            ${!task.completed ? `
              <div class="task-detail-item">
                <span>🔁</span> Repeats every ${task.nagIntervalMinutes} min
              </div>
            ` : ''}
          </div>

          <div class="task-actions">
            ${!task.completed ? `
              <button class="btn btn-success btn-sm" onclick="completeTask('${task.id}')">
                ✓ Mark Completed
              </button>
              <button class="btn btn-outline btn-sm" onclick="snoozeTask('${task.id}', 10)">
                +10m Snooze
              </button>
            ` : `
              <button class="btn btn-outline btn-sm" onclick="reactivateTask('${task.id}')">
                ↩ Re-open
              </button>
            `}
            <button class="btn btn-outline btn-sm" style="margin-left: auto; color: var(--danger);" onclick="deleteTask('${task.id}')">
              🗑
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function reactivateTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = false;
        task.completedAt = null;
        task.dueDate = Date.now() + 5 * 60000;
        saveTasks();
        renderTasks();
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // --- Tab Switching ---
    const tabActive = document.getElementById('tabActive');
    const tabCompleted = document.getElementById('tabCompleted');

    tabActive.addEventListener('click', () => {
      currentTab = 'active';
      tabActive.classList.add('active');
      tabCompleted.classList.remove('active');
      renderTasks();
    });

    tabCompleted.addEventListener('click', () => {
      currentTab = 'completed';
      tabCompleted.classList.add('active');
      tabActive.classList.remove('active');
      renderTasks();
    });

    // --- Sound Tester ---
    document.getElementById('testSoundBtn').addEventListener('click', () => {
      initAudio();
      playBeepPattern();
    });

    // Init display
    updateCounts();
    renderTasks();
  </script>
</body>
</html>
